# microgpt frontend — nginx: statikus fájlok + API proxy a backendre
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A plotly.js és az API-kérések a backend konténerre mennek
    location /plotly.min.js { proxy_pass http://backend:8000; }
    location /complete       { proxy_pass http://backend:8000; }
    location /config         { proxy_pass http://backend:8000; }
    location /retrain        { proxy_pass http://backend:8000; }
    location /temperature    { proxy_pass http://backend:8000; }
    location /plot/          { proxy_pass http://backend:8000; }

    # Minden más: statikus fájl (index.html, viz.html, app.js, viz.js, style.css)
    location / {
        try_files $uri $uri/ =404;
    }
}

# microgpt — két konténer: backend (uvicorn) + frontend (nginx)
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    # GPU-átadás (opcionális, nvidia-container-toolkit szükséges):
    #   ha a gépen van NVIDIA GPU és CUDA, távolítsd el a kommentet:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
